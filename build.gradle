plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

configurations {
    shadedImplementation { transitive = false }
    fabricMixin { transitive = false }
    implementation.extendsFrom(shadedImplementation, fabricMixin)
}

loom {
    silentMojangMappingsLicense()

    accessWidenerPath = file("src/main/resources/vulkanmod.accesswidener")
    forge {
        mixinConfig 'vulkanmod.mixins.json'
        accessWidenerPath = file("src/main/resources/vulkanmod.accesswidener")
        convertAccessWideners = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Sinytra'
        url = 'https://maven.su5ed.dev/releases/'
    }
    mavenLocal()

}

project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.4"
project.ext.winNatives = "natives-windows"
project.ext.linuxNatives = "natives-linux"
project.ext.macosNatives = "natives-macos"
project.ext.macosArmNatives = "natives-macos-arm64"

dependencies {
    minecraft "net.minecraft:minecraft:$project.minecraft_version"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:$project.forge_version"
    fabricMixin "org.sinytra:sponge-mixin:${mixin_version}"

    include(modImplementation("cn.ksmcbrigade:MixinRuntime:1.0"))

    implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion")

    ext.includeNatives = { name ->
        implementation("$name:$lwjglVersion")
        implementation("$name:$lwjglVersion:$winNatives")
        runtimeOnly("$name:$lwjglVersion:$linuxNatives")
        runtimeOnly("$name:$lwjglVersion:$macosNatives")
        runtimeOnly("$name:$lwjglVersion:$macosArmNatives")
    }

    includeNatives("org.lwjgl:lwjgl-vma")
    includeNatives("org.lwjgl:lwjgl-shaderc")

    //MoltenVK
    implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion:$macosNatives")
    implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion:$macosArmNatives")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}


shadowJar {
    from("licenses") {
        into "META-INF/"
    }
    from("LICENSE.txt") {
        into "META-INF/"
    }
    // Exclude dependency licenses since we include them ourselves
    exclude "**/LICENSE*"
    exclude "**/NOTICE*"
    exclude "META-INF/maven/**"
    exclude "META-INF/versions/**"

    archiveClassifier = "shadow"
    configurations = [project.configurations.shadedImplementation]
}

tasks.register("fullJar", org.gradle.jvm.tasks.Jar) {
    dependsOn(shadowJar)
    manifest.from(jar.manifest)
    from(zipTree(shadowJar.archiveFile))
    from(provider { configurations.fabricMixin.singleFile }) {
        rename { "fabric-mixin.jar" }
    }
    archiveClassifier = ""
}

assemble.dependsOn fullJar

// Replace published jar artifact with shadowJar
configurations {
    [runtimeElements, apiElements].each {
        it.outgoing {
            artifacts.clear()
            artifact(fullJar)
        }
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

// Configure Maven publishing.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
